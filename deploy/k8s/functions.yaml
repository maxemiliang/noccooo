# Generated by mcloud from the app's functions (maxcloud-functions
# --describe). Don't edit: the deploy workflow rewrites this file on every
# deploy. Change a function's options in its code instead.
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: maxcloud-functions
  name: web
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/max-scale: "2"
        autoscaling.knative.dev/min-scale: "1"
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: maxcloud-functions
    spec:
      containers:
      - env:
        - name: FUNCTION_TARGET
          value: web
        - name: MAXCLOUD_APP
          value: noccooo
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: db-app
              optional: true
        envFrom:
        - secretRef:
            name: maxcloud-s3
            optional: true
        - configMapRef:
            name: app-env
            optional: true
        - secretRef:
            name: app-secrets
            optional: true
        image: app
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
        resources:
          limits:
            memory: 256Mi
          requests:
            memory: 256Mi
      priorityClassName: tenant
      timeoutSeconds: 300
